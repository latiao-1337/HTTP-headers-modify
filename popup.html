<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; padding: 16px; width: 420px; }
  h3 { margin: 14px 0 4px; font-size: 14px; }
  .hint { font-size: 11px; color: #888; margin-bottom: 6px; }
  .row { display: flex; gap: 4px; margin-bottom: 6px; align-items: center;
         padding: 2px; border-radius: 4px; }
  .row input[type="text"] {
    flex: 1; padding: 4px 6px; box-sizing: border-box; font-size: 12px;
    border: 1px solid #ccc; border-radius: 3px;
  }
  .row input[type="checkbox"] { flex: 0 0 auto; margin: 0 2px; cursor: pointer; }
  .row button { padding: 2px 8px; cursor: pointer; }
  .row.disabled { background: #f7f7f7; }
  .row.disabled input[type="text"] { opacity: 0.5; color: #666; }
  .add-btn { font-size: 12px; padding: 4px 8px; cursor: pointer; }
  #save { margin-top: 14px; width: 100%; padding: 8px; cursor: pointer; }
  #clear { margin-top: 6px; width: 100%; padding: 6px; cursor: pointer; }
  #status { margin-top: 8px; font-size: 12px; color: #0a0; }
</style>
</head>
<body>
  <h3>请求头</h3>
  <div class="hint">勾选=启用；不勾选=草稿（不写入规则）。值留空 → 删除该头</div>
  <div id="reqList"></div>
  <button class="add-btn" id="addReq">+ 添加请求头</button>

  <h3>响应头</h3>
  <div class="hint">勾选=启用；不勾选=草稿（不写入规则）。值留空 → 删除该头</div>
  <div id="resList"></div>
  <button class="add-btn" id="addRes">+ 添加响应头</button>

  <button id="save">保存并全局启用（仅勾选项）</button>
  <button id="clear">清除全部规则</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
